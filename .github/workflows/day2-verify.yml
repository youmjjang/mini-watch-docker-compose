name: Day2 verification
on:
  push:
    branches: [day2-deploy]
  workflow_dispatch:
jobs:
  python-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [general, monitor/backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m compileall -q .
        working-directory: ${{ matrix.app }}
      - run: python -m pip install -r requirements.txt
        working-directory: ${{ matrix.app }}
  next-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monitor/next-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: monitor/next-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
